[project]
name = "tasklite"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tasklite = "tasklite:main"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/tasklite.py"]
sources = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
