name: gibson-gate
on: pull_request
permissions: { contents: read }
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run mypy --strict src
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build